<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maatschappijleer Arcade Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#101936;--bg:#f3f6fc;--card:#fff;--blue:#2f5bff;--mint:#12b886;--red:#f0485a;--amber:#ffb020;--mute:#6b7699;--line:#dfe5f3}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Sora,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex}
#game{width:75%;padding:28px 36px;overflow:auto;display:flex;flex-direction:column}
#board{width:25%;background:var(--ink);color:#fff;padding:24px 20px;overflow:auto}
h1{font-size:2rem;font-weight:800;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:1.3rem;margin:0 0 14px}
p{line-height:1.5;color:var(--mute);margin:0 0 18px}
.box{max-width:720px;margin:auto 0}
input#tag{font:800 2.2rem Sora,sans-serif;width:min(100%,11ch);text-align:center;text-transform:uppercase;letter-spacing:.12em;border:3px solid var(--ink);border-radius:14px;padding:8px 8px 8px 20px;background:#fff;color:var(--ink)}
input#tag:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.lv button{font:inherit;text-align:left;padding:16px;border:2px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;color:var(--ink);transition:transform .12s,border-color .12s}
.lv button:hover:not(:disabled){transform:translateY(-3px);border-color:var(--blue)}
.lv button:disabled{opacity:.4;cursor:not-allowed}
.lv b{display:block;font-size:1.15rem;margin-bottom:4px}
.lv small{color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:10px;gap:12px}
.pill{background:var(--ink);color:#fff;border-radius:99px;padding:4px 14px;font-size:.85rem}
.score{font-size:1.4rem;font-weight:800;color:var(--blue)}
#tbar{height:14px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:22px}
#tfill{height:100%;width:100%;background:var(--mint);border-radius:99px}
#q{font-size:1.6rem;font-weight:800;line-height:1.25;margin:0 0 20px;letter-spacing:-.01em}
#qimg{max-width:100%;max-height:240px;border-radius:14px;margin-bottom:18px;display:block}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans button{font:600 1rem Sora,sans-serif;display:flex;gap:12px;align-items:center;text-align:left;padding:16px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);cursor:pointer;min-height:68px}
.ans button:hover:not(:disabled){border-color:var(--blue)}
.ans i{font-style:normal;font-weight:800;background:var(--bg);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.ans button.ok{background:var(--mint);border-color:var(--mint);color:#fff}
.ans button.no{background:var(--red);border-color:var(--red);color:#fff}
.cta{font:800 1.1rem Sora,sans-serif;background:var(--blue);color:#fff;border:0;border-radius:14px;padding:16px 28px;cursor:pointer;margin-top:18px}
.cta:disabled{opacity:.4;cursor:not-allowed}
#fb{min-height:1.6em;margin-top:14px;font-weight:800}
#mapwrap{max-width:380px}
svg.map{width:100%;max-height:56vh;border-radius:14px;display:block}svg.map .c{fill:#dfe5f3}svg.map .w{fill:#bcdcf2;pointer-events:none}svg.map .b{fill:none;stroke:#fff;stroke-width:3;pointer-events:none}svg.map path[data-n]{fill:#fff;stroke:#7d8fc4;stroke-width:2;cursor:pointer;transition:fill .12s}svg.map path[data-n]:hover{fill:#cdd9ff}svg.map path.ok{fill:#12b886!important}svg.map path.no{fill:#f0485a!important}svg.map.lock path{pointer-events:none}
.big{font-size:4rem;font-weight:800;color:var(--blue);margin:0}
#board h3{margin:0 0 4px;font-size:1.1rem}
#board .sub{color:#8fa0d6;font-size:.78rem;margin-bottom:14px}
#board ol{list-style:none;margin:0;padding:0}
#board li{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;margin-bottom:4px;background:rgba(255,255,255,.06);font-weight:600}
#board li:nth-child(1){background:var(--amber);color:var(--ink)}
#board li .r{width:1.4em;opacity:.7}
#board li .n{letter-spacing:.06em;font-weight:800;flex:1;overflow:hidden;text-overflow:ellipsis}
#board li .l{font-size:.68rem;opacity:.7}
#board li .p{font-variant-numeric:tabular-nums}
.hide{display:none!important}
@media(max-width:800px){body{flex-direction:column;height:auto}#game,#board{width:100%}.ans,.lv{grid-template-columns:1fr}#q{font-size:1.25rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="game">
 <section id="s-start" class="box">
  <h1>Maatschappijleer Quiz</h1>
  <p>Van Helmond tot Europa. 10 vragen, 15 seconden per vraag. Hoe sneller je goed antwoordt, hoe meer punten (max 1000).</p>
  <h2>Kies je naam (max 10 letters)</h2>
  <input id="tag" maxlength="10" autocomplete="off" aria-label="Je naam (1 tot 10 letters)" placeholder="NAAM">
  <div class="lv" id="lv">
   <button data-l="easy" disabled><b>Easy</b><small>Lokaal en basis</small></button>
   <button data-l="hard" disabled><b>Hard</b><small>Landelijk en inzicht</small></button>
   <button data-l="ultimate" disabled><b>Ultimate</b><small>Historie, EU en ouders</small></button>
  </div>
 </section>
 <section id="s-play" class="box hide" style="width:100%">
  <div class="top"><span class="pill" id="lab"></span><span id="cnt"></span><span class="score" id="sc">0</span></div>
  <div id="tbar"><div id="tfill"></div></div>
  <h2 id="q"></h2>
  <img id="qimg" class="hide" alt="">
  <div class="ans" id="ans"></div>
  <div id="mapwrap" class="hide"></div>
  <div id="fb" role="status"></div>
 </section>
 <section id="s-end" class="box hide">
  <p style="margin:0">Je score</p>
  <p class="big" id="final"></p>
  <h2 id="endmsg"></h2>
  <button class="cta" id="again">Nog een ronde</button>
 </section>
</main>
<aside id="board">
 <h3>Leaderboard</h3>
 <div class="sub" id="bsub">Top 15 live</div>
 <ol id="bl"></ol>
</aside>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

/* ===== LEADERBOARD ===== */
const useFB = !!(firebaseConfig.apiKey && firebaseConfig.databaseURL && window.firebase);
let db = null;
if (useFB) { firebase.initializeApp(firebaseConfig); db = firebase.database().ref("scores"); }
const $ = id => document.getElementById(id);
function render(list){
  list.sort((a,b)=>b.score-a.score);
  $("bl").innerHTML = list.slice(0,15).map((s,i)=>`<li><span class="r">${i+1}</span><span class="n">${s.name}</span><span class="l">${s.level}</span><span class="p">${s.score}</span></li>`).join("") || "<li>Nog geen scores</li>";
}
function loadBoard(){
  if (useFB) { db.limitToLast(200).on("value", sn => { const a=[]; sn.forEach(c=>a.push(c.val())); render(a); }); }
  else { $("bsub").textContent="Lokaal leaderboard (geen Firebase ingesteld)"; render(JSON.parse(localStorage.getItem("mq_scores")||"[]")); }
}
function saveScore(s){
  if (useFB) return db.push(s);
  try { const a=JSON.parse(localStorage.getItem("mq_scores")||"[]"); a.push(s); localStorage.setItem("mq_scores",JSON.stringify(a)); render(a); } catch(e){ render([s]); }
}

/* ===== GAME ===== */
const T = 15, N = 10, LET = ["A","B","C","D"];
let tag="", level="", qs=[], i=0, score=0, t0=0, tick=null, locked=false;
const shuffle = a => { a=a.slice(); for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];} return a; };
const show = id => ["s-start","s-play","s-end"].forEach(s=>$(s).classList.toggle("hide",s!==id));

$("tag").addEventListener("input",e=>{
  e.target.value=e.target.value.replace(/[^a-zA-Z]/g,"").toUpperCase().slice(0,10);
  tag=e.target.value; document.querySelectorAll("#lv button").forEach(b=>b.disabled=tag.length<1);
});
document.querySelectorAll("#lv button").forEach(b=>b.onclick=()=>start(b.dataset.l));
$("again").onclick=()=>{show("s-start");};

function start(l){
  level=l; qs=shuffle(P[l]).slice(0,N); i=0; score=0; $("sc").textContent=0; show("s-play"); next();
}
function next(){
  if(i>=qs.length) return end();
  locked=false; const q=qs[i];
  $("lab").textContent=level; $("cnt").textContent=`Vraag ${i+1} van ${N}`; $("fb").textContent=""; $("fb").style.color="";
  $("q").textContent=q[1];
  const im=$("qimg"), an=$("ans"), mw=$("mapwrap"); an.innerHTML=""; mw.innerHTML="";
  im.classList.toggle("hide",q[0]!=="img"); an.classList.toggle("hide",q[0]==="map"); mw.classList.toggle("hide",q[0]!=="map");
  if(q[0]==="img"){ im.src=q[4]; im.alt="Afbeelding bij de vraag"; }
  if(q[0]==="map"){
    mw.innerHTML=MAP; q.correct=q[2];
    mw.querySelectorAll("path").forEach(p=>p.onclick=()=>answer(p.dataset.n===q[2],p));
  } else {
    const right=q[2][q[3]]; q.correct=right;
    shuffle(q[2]).forEach((o,k)=>{
      const b=document.createElement("button"); b.innerHTML=`<i>${LET[k]}</i><span></span>`; b.lastChild.textContent=o;
      b.onclick=()=>answer(o===right,b); b.dataset.o=o; an.appendChild(b);
    });
  }
  t0=performance.now(); clearInterval(tick);
  tick=setInterval(()=>{
    const left=Math.max(0,T-(performance.now()-t0)/1000);
    const f=$("tfill"); f.style.width=(left/T*100)+"%"; f.style.background=left>8?"var(--mint)":left>4?"var(--amber)":"var(--red)";
    if(left<=0) answer(false,null,true);
  },50);
}
function answer(ok,el,timeout){
  if(locked) return; locked=true; clearInterval(tick);
  const used=Math.min(T,(performance.now()-t0)/1000);
  const pts=ok?Math.max(50,Math.round(1000*(1-used/T))):0; score+=pts; $("sc").textContent=score;
  const q=qs[i];
  if(q[0]==="map"){ $("map").classList.add("lock"); if(el) el.classList.add(ok?"ok":"no"); $(q.correct).classList.add("ok"); }
  else document.querySelectorAll("#ans button").forEach(b=>{ b.disabled=true; if(b.dataset.o===q.correct) b.classList.add("ok"); else if(b===el) b.classList.add("no"); });
  $("fb").style.color=ok?"var(--mint)":"var(--red)";
  $("fb").textContent=ok?`Goed! +${pts} punten`:(timeout?"Tijd op! ":"Helaas. ")+"Het juiste antwoord: "+q.correct;
  i++; setTimeout(next, ok?1200:2400);
}
function end(){
  show("s-end"); $("final").textContent=score;
  $("endmsg").textContent=score>=7000?"Topscore, echte Quizmaster!":score>=4000?"Sterk gespeeld!":"Goed geprobeerd, speel nog een keer!";
  saveScore({name:tag,score:score,level:level,ts:Date.now()});
}
loadBoard();
</script>
